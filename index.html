<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Private Access Portal</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet" />
  <style>
:root {
  --bg: #f4f2ec;
  --surface: #ffffff;
  --surface-alt: #ebe7dd;
  --ink: #16181d;
  --ink-muted: #525660;
  --border: #dcd6c8;
  --header-bg: #15171c;
  --header-ink: #f7f5f0;
  --accent: #c2510a;
  --accent-soft: #fef3c7;
  --green: #0f766e;
  --green-soft: #ccfbf1;
  --red: #b91c1c;
  --red-soft: #fee2e2;
  --amber: #b45309;
  --amber-soft: #fef3c7;
  --shadow: 0 1px 2px rgba(15, 23, 42, 0.05), 0 8px 24px rgba(15, 23, 42, 0.04);
  --radius: 10px;
  --font-serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-sans: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}

[data-theme="dark"] {
  --bg: #101216;
  --surface: #181b21;
  --surface-alt: #21252e;
  --ink: #eef0f4;
  --ink-muted: #9ca3af;
  --border: #2b303b;
  --header-bg: #0c0d10;
  --header-ink: #f3f4f6;
  --accent: #f0883e;
  --accent-soft: #2e2014;
  --green: #2dd4bf;
  --green-soft: #112a27;
  --red: #f87171;
  --red-soft: #2c1618;
  --amber: #fbbf24;
  --amber-soft: #2b2313;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden], .is-hidden { display: none !important; }
html { scroll-behavior: smooth; scroll-padding-top: 120px; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.62;
  -webkit-font-smoothing: antialiased;
}

a { color: var(--accent); }

/* Auth Gate */
.auth-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: radial-gradient(circle at top, rgba(194, 81, 10, 0.08), transparent 55%), var(--bg);
}

.auth-card {
  width: 100%;
  max-width: 410px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 34px 30px;
  box-shadow: var(--shadow);
}

.auth-title {
  margin: 0 0 8px;
  font-family: var(--font-serif);
  font-size: 34px;
  line-height: 1.1;
  font-weight: 700;
  letter-spacing: -0.02em;
}

.auth-subtitle {
  margin: 0 0 22px;
  font-size: 13.5px;
  color: var(--ink-muted);
}

.auth-form { display: flex; flex-direction: column; gap: 14px; }
.auth-label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; }

.auth-input {
  width: 100%;
  padding: 11px 13px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 15px;
}

.auth-input:focus { outline: none; border-color: var(--accent); }
.auth-pass-wrap { position: relative; display: flex; align-items: center; }
.auth-pass-wrap .auth-input { padding-right: 68px; }

.auth-toggle-pass {
  position: absolute;
  right: 8px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--ink-muted);
  border-radius: 6px;
  padding: 5px 10px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}

.auth-toggle-pass:hover { color: var(--ink); background: var(--surface-alt); }

.auth-error {
  padding: 10px 12px;
  border-radius: 8px;
  background: var(--red-soft);
  color: var(--red);
  font-size: 13px;
  font-weight: 600;
}

.auth-submit { width: 100%; padding: 12px 16px; margin-top: 4px; font-size: 14.5px; }

/* Topbar & Quick Nav */
.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  background: var(--header-bg);
  color: var(--header-ink);
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}

.topbar-inner {
  max-width: 1440px;
  margin: 0 auto;
  padding: 12px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.brand { display: flex; align-items: center; gap: 12px; }
.brand-link { display: flex; flex-direction: column; text-decoration: none; color: var(--header-ink); }

.brand-kicker {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.14em;
  color: #f0883e;
  font-weight: 600;
}

.brand-title {
  font-family: var(--font-serif);
  font-size: 22px;
  font-weight: 700;
  line-height: 1.08;
}

.menu-toggle {
  display: none;
  flex-direction: column;
  gap: 4px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.18);
  border-radius: 6px;
  padding: 8px 7px;
  cursor: pointer;
}

.menu-toggle span { display: block; width: 18px; height: 2px; background: #fff; }

.topbar-controls {
  display: flex;
  align-items: center;
  gap: 10px;
  flex: 1;
  justify-content: flex-end;
  max-width: 680px;
}

.search-wrap { position: relative; flex: 1; max-width: 420px; }

.search-input {
  width: 100%;
  padding: 9px 32px 9px 14px;
  border: 1px solid rgba(255, 255, 255, 0.16);
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.08);
  color: #fff;
  font-family: var(--font-sans);
  font-size: 13.5px;
}

.search-input::placeholder { color: rgba(255, 255, 255, 0.55); }
.search-input:focus { outline: none; border-color: #f0883e; background: rgba(255, 255, 255, 0.12); }

.search-clear {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  border: none;
  background: transparent;
  color: rgba(255, 255, 255, 0.7);
  font-size: 18px;
  cursor: pointer;
}

.quick-nav {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  scrollbar-width: none;
}

.quick-nav::-webkit-scrollbar { display: none; }

.quick-nav-inner {
  max-width: 1440px;
  margin: 0 auto;
  padding: 8px 24px;
  display: flex;
  align-items: center;
  gap: 8px;
  white-space: nowrap;
}

.quick-link {
  display: inline-block;
  padding: 5px 11px;
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--ink-muted);
  text-decoration: none;
  border: 1px solid var(--border);
  background: var(--bg);
  transition: all 0.15s ease;
}

.quick-link:hover, .quick-link.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}

.theme-btn, .btn-secondary, .btn-primary, .copy-btn {
  font-family: var(--font-sans);
  font-size: 13px;
  font-weight: 600;
  border-radius: 7px;
  padding: 8px 13px;
  cursor: pointer;
  transition: background 0.15s ease, border-color 0.15s ease;
}

.topbar .theme-btn, .topbar .btn-secondary {
  background: rgba(255, 255, 255, 0.08);
  color: #fff;
  border: 1px solid rgba(255, 255, 255, 0.18);
}

.topbar .theme-btn:hover, .topbar .btn-secondary:hover {
  background: rgba(255, 255, 255, 0.16);
}

.btn-secondary, .copy-btn {
  background: var(--surface);
  color: var(--ink);
  border: 1px solid var(--border);
}

.btn-secondary:hover, .copy-btn:hover { background: var(--surface-alt); }

.btn-primary {
  background: var(--accent);
  color: #fff;
  border: 1px solid var(--accent);
}

.btn-primary:hover { filter: brightness(0.92); }

/* Layout */
.layout {
  max-width: 1440px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 260px minmax(0, 1fr);
  gap: 32px;
  padding: 28px 24px 84px;
}

.sidebar {
  position: sticky;
  top: 120px;
  align-self: start;
  max-height: calc(100vh - 140px);
  overflow-y: auto;
  padding-right: 8px;
}

.sidebar-section { margin-bottom: 22px; }

.sidebar-label {
  font-family: var(--font-mono);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--ink-muted);
  margin-bottom: 10px;
}

.nav-list { display: flex; flex-direction: column; gap: 3px; }

.nav-item {
  display: block;
  padding: 7px 11px;
  border-radius: 7px;
  color: var(--ink-muted);
  text-decoration: none;
  font-size: 13.5px;
  font-weight: 500;
  border-left: 2px solid transparent;
}

.nav-item:hover { background: var(--surface-alt); color: var(--ink); }
.nav-item.active {
  background: var(--surface);
  color: var(--ink);
  font-weight: 600;
  border-left-color: var(--accent);
  box-shadow: var(--shadow);
}

.progress-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
}

.progress-bar-track {
  height: 7px;
  background: var(--surface-alt);
  border-radius: 999px;
  overflow: hidden;
  margin-bottom: 8px;
}

.progress-bar-fill { height: 100%; background: var(--accent); transition: width 0.25s ease; }
.progress-meta { font-family: var(--font-mono); font-size: 12px; color: var(--ink-muted); }

/* Main Content */
.main-content { min-width: 0; display: flex; flex-direction: column; gap: 52px; }
.section { scroll-margin-top: 124px; }

.eyebrow {
  margin: 0 0 6px;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  color: var(--accent);
  font-weight: 600;
}

.hero-title {
  margin: 0 0 12px;
  font-family: var(--font-serif);
  font-size: clamp(38px, 4.5vw, 56px);
  line-height: 1.05;
  letter-spacing: -0.025em;
  font-weight: 700;
}

.hero-subtitle { margin: 0 0 24px; max-width: 74ch; font-size: 16.5px; color: var(--ink-muted); }

.section-heading {
  margin: 0 0 8px;
  font-family: var(--font-serif);
  font-size: clamp(26px, 2.8vw, 34px);
  line-height: 1.15;
  letter-spacing: -0.015em;
  font-weight: 700;
}

.sub-heading { margin: 0 0 12px; font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
.section-lead { margin: 0 0 20px; color: var(--ink-muted); max-width: 76ch; }
.subsection { margin-top: 28px; }

.section-header-row {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 18px;
}

/* Clickable Stat Cards */
.stats-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 12px;
  margin-bottom: 30px;
}

.stat-card {
  display: block;
  text-decoration: none;
  color: inherit;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 15px 16px;
  box-shadow: var(--shadow);
  transition: transform 0.15s ease, border-color 0.15s ease;
}

.stat-card:hover {
  transform: translateY(-2px);
  border-color: var(--accent);
}

.stat-val { font-family: var(--font-serif); font-size: 32px; font-weight: 700; line-height: 1.1; color: var(--ink); }
.stat-lbl { font-size: 12.5px; color: var(--ink-muted); margin-top: 4px; }
.stat-jump { display: inline-block; margin-top: 6px; font-family: var(--font-mono); font-size: 11px; color: var(--accent); font-weight: 600; }

/* Grids & Cards */
.two-col-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.three-col-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }

.info-card, .callout-card, .prompt-card, .linter-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow);
}

.card-title { margin: 0 0 8px; font-size: 16.5px; font-weight: 700; }
.muted-note { margin: 0; color: var(--ink-muted); font-size: 13.5px; }

.filter-pills { display: flex; flex-wrap: wrap; gap: 6px; }

.pill {
  padding: 6px 12px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--ink-muted);
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
}

.pill.active { background: var(--ink); color: var(--surface); border-color: var(--ink); }

.inline-filter {
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
  color: var(--ink);
  min-width: 240px;
  font-family: var(--font-sans);
  font-size: 13.5px;
}

.badge {
  display: inline-block;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 5px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.badge-CRITICAL { background: var(--red-soft); color: var(--red); }
.badge-HIGH { background: var(--amber-soft); color: var(--amber); }
.badge-MEDIUM { background: var(--surface-alt); color: var(--ink); }
.badge-LOW { background: var(--green-soft); color: var(--green); }
.badge-neutral { background: var(--surface-alt); color: var(--ink-muted); }

.stack-list { display: flex; flex-direction: column; gap: 12px; }

.shift-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 20px;
  box-shadow: var(--shadow);
}

.shift-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.shift-title { margin: 0; font-size: 16px; font-weight: 700; }
.shift-cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; font-size: 13.5px; }

.shift-col-label {
  display: block;
  font-family: var(--font-mono);
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-muted);
  margin-bottom: 4px;
}

.checklist-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }

.check-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 15px 16px;
  cursor: pointer;
}

.check-item.checked { border-color: var(--green); }
.check-item input { margin-top: 4px; accent-color: var(--accent); width: 16px; height: 16px; cursor: pointer; }
.check-num { font-family: var(--font-mono); font-size: 11px; color: var(--accent); font-weight: 600; }

.vetting-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
}

.vetting-verdict-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 14px 16px;
  background: var(--surface-alt);
  border-radius: 8px;
  margin-bottom: 16px;
}

.verdict-badge {
  display: inline-block;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 5px;
  background: var(--surface);
  border: 1px solid var(--border);
  margin-bottom: 4px;
}

.verdict-badge.go { background: var(--green-soft); color: var(--green); border-color: transparent; }
.verdict-badge.caution { background: var(--amber-soft); color: var(--amber); border-color: transparent; }
.verdict-badge.skip { background: var(--red-soft); color: var(--red); border-color: transparent; }
.verdict-summary { margin: 0; font-size: 13.5px; color: var(--ink-muted); }

.vetting-gates-list { display: flex; flex-direction: column; gap: 10px; }

.gate-row {
  display: grid;
  grid-template-columns: minmax(220px, 1fr) 1.3fr auto;
  gap: 14px;
  align-items: center;
  padding: 12px 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
}

.gate-toggle-group { display: flex; gap: 6px; }

.gate-btn {
  padding: 6px 11px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--ink-muted);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}

.gate-btn.pass.active { background: var(--green-soft); color: var(--green); border-color: transparent; }
.gate-btn.fail.active { background: var(--red-soft); color: var(--red); border-color: transparent; }
.callout-card { border-left: 3px solid var(--accent); }

.bullet-panel {
  margin: 16px 0 0;
  padding: 18px 20px 18px 36px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}

.bullet-panel li { margin-bottom: 8px; font-size: 14px; }

.archetype-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }

.archetype-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  box-shadow: var(--shadow);
}

.archetype-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.hook-box { background: var(--surface-alt); border-radius: 8px; padding: 12px 14px; font-size: 13px; white-space: pre-wrap; margin-top: auto; }

.decoder-table-wrap { display: flex; flex-direction: column; gap: 10px; }

.decoder-row {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 15px 18px;
  display: grid;
  grid-template-columns: 1fr 1fr 1.2fr;
  gap: 16px;
  font-size: 13.5px;
}

.decoder-signal { font-weight: 700; color: var(--ink); }
.laws-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; margin-bottom: 24px; }

.linter-header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 14px; margin-bottom: 14px; }
.linter-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.checkbox-inline { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-muted); cursor: pointer; }

.linter-textarea {
  width: 100%;
  padding: 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 14.5px;
  line-height: 1.55;
  resize: vertical;
}

.linter-textarea:focus { outline: none; border-color: var(--accent); }
.linter-metrics { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0 10px; }
.metric-chip { font-family: var(--font-mono); font-size: 12px; padding: 5px 10px; border-radius: 6px; background: var(--surface-alt); }
.linter-checks { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 8px; }
.lint-item { padding: 9px 12px; border-radius: 7px; font-size: 13px; border: 1px solid var(--border); }
.lint-item.ok { background: var(--green-soft); color: var(--green); border-color: transparent; }
.lint-item.warn { background: var(--amber-soft); color: var(--amber); border-color: transparent; }
.lint-item.fail { background: var(--red-soft); color: var(--red); border-color: transparent; }

.table-scroll { overflow-x: auto; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
.comparison-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.comparison-table th, .comparison-table td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
.comparison-table th { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-muted); background: var(--surface-alt); }

.proposals-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
.proposal-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow); }
.proposal-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.proposal-body { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 13px 14px; font-size: 13.5px; white-space: pre-wrap; line-height: 1.55; }
.proposal-footer { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: auto; }

.secrets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 14px; }
.secret-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }
.secret-num { font-family: var(--font-mono); font-size: 11.5px; color: var(--accent); font-weight: 600; margin-bottom: 4px; }

.ordered-list { margin: 0; padding-left: 20px; font-size: 14px; }
.ordered-list li { margin-bottom: 8px; }
.script-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; }
.script-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 10px; }

.script-pre, .prompt-code {
  margin: 0;
  padding: 14px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-family: var(--font-mono);
  font-size: 12.5px;
  line-height: 1.58;
  white-space: pre-wrap;
  overflow-x: auto;
}

.prompt-card { margin-top: 24px; }
.prompt-card-header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }

.search-results-panel { background: var(--surface); border: 1px solid var(--accent); border-radius: var(--radius); padding: 20px; }
.search-results-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.search-results-header h2 { margin: 0; font-size: 18px; }
.search-results-list { display: flex; flex-direction: column; gap: 10px; }
.search-hit { padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px; text-decoration: none; color: inherit; display: block; }
.search-hit:hover { background: var(--surface-alt); }

.toast {
  position: fixed;
  bottom: 22px;
  right: 22px;
  background: var(--header-bg);
  color: #fff;
  padding: 10px 16px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  opacity: 0;
  pointer-events: none;
  transform: translateY(8px);
  transition: opacity 0.2s ease, transform 0.2s ease;
  z-index: 60;
}

.toast.show { opacity: 1; transform: translateY(0); }

@media (max-width: 1024px) {
  .layout { grid-template-columns: 1fr; }
  .menu-toggle { display: flex; }
  .sidebar {
    position: fixed;
    left: -290px;
    top: 104px;
    width: 270px;
    height: calc(100vh - 104px);
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 20px 16px;
    z-index: 50;
    transition: left 0.2s ease;
  }
  .sidebar.open { left: 0; }
  .shift-cols, .decoder-row, .three-col-grid, .archetype-grid { grid-template-columns: 1fr; }
  .gate-row { grid-template-columns: 1fr; }
}

@media (max-width: 680px) {
  .two-col-grid { grid-template-columns: 1fr; }
  .topbar-inner { flex-wrap: wrap; }
  .topbar-controls { max-width: none; width: 100%; }
}
  </style>
</head>

            id="authUser"
            name="username"
            class="auth-input"
            autocomplete="username"
            autocapitalize="none"
            autocorrect="off"
            spellcheck="false"
            required
            autofocus

        <label class="auth-label" for="authPass">
          <span>Password</span>
          <div class="auth-pass-wrap">

              class="auth-input"
              autocomplete="current-password"
              autocapitalize="none"
              autocorrect="off"
              spellcheck="false"
              required

            <button type="button" class="auth-toggle-pass" id="togglePassBtn" aria-label="Show password">Show</button>
          </div>

        <div class="auth-error" id="authError" role="alert" hidden></div>

        <button type="submit" class="btn-primary auth-submit" id="authSubmitBtn">
          Unlock Dossier
        </button>
      </form>
    </section>

  <script>
(function () {
  "use strict";

  const SESSION_KEY = "upw_vault_session_v1";

  function safeGet(store, key) {
    try { return store.getItem(key); } catch (_) { return null; }
  }
  function safeSet(store, key, val) {
    try { store.setItem(key, val); } catch (_) {}
  }
  function safeRemove(store, key) {
    try { store.removeItem(key); } catch (_) {}
  }

  const esc = (str) =>
    String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");

  function b64ToBytes(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) {
      bytes[i] = bin.charCodeAt(i);
    }
    return bytes;
  }

  async function decryptVault(username, password) {
    const vault = window.ENCRYPTED_VAULT;
    if (!vault) {
      const e = new Error("Encrypted payload unavailable.");
      e.isSystem = true;
      throw e;
    }
    if (!window.crypto || !window.crypto.subtle) {
      const e = new Error("Browser Web Crypto API requires HTTPS (open via the https://artyzaudio.github.io/upw/ link).");
      e.isSystem = true;
      throw e;
    }
    const enc = new TextEncoder();
    const normalizedUser = String(username || "").trim().toLowerCase();
    const secretBytes = enc.encode(`${normalizedUser}:${password}`);
    const baseKey = await window.crypto.subtle.importKey(
      "raw",
      secretBytes,
      "PBKDF2",
      false,
      ["deriveKey"]
    );
    const aesKey = await window.crypto.subtle.deriveKey(
      {
        name: "PBKDF2",
        salt: b64ToBytes(vault.salt),
        iterations: vault.iter,
        hash: "SHA-256"
      },
      baseKey,
      { name: "AES-GCM", length: 256 },
      false,
      ["decrypt"]
    );
    const plainBuf = await window.crypto.subtle.decrypt(
      { name: "AES-GCM", iv: b64ToBytes(vault.iv) },
      aesKey,
      b64ToBytes(vault.data)
    );
    return JSON.parse(new TextDecoder().decode(plainBuf));
  }

  if (safeGet(window.localStorage, "upw_theme") === "dark") {
    document.documentElement.setAttribute("data-theme", "dark");
  }

  const toastEl = document.getElementById("toast");
  let toastTimer = null;
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2000);
  }

  function copyText(text, label) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(
        () => showToast(`Copied: ${label}`),
        () => fallbackCopy(text, label)
      );
    } else {
      fallbackCopy(text, label);
    }
  }

  function fallbackCopy(text, label) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand("copy");
      showToast(`Copied: ${label}`);
    } catch (_) {
      showToast("Clipboard unavailable");
    }
    document.body.removeChild(ta);
  }

        <span class="metric-chip">Words: ${words} (Target ${minW}–${maxW})</span>
        <span class="metric-chip">Opening Sentence: ${firstSentence.length} chars (Preview limit ~150)</span>
        <span class="metric-chip">Line 1: ${firstLine.length} chars</span>
      `;

      if (!trimmed) {
        document.getElementById("linterChecks").innerHTML = `<div class="lint-item">Awaiting proposal draft text.</div>`;
        return;
      }

      const checks = [];
      const greetingRe = /^(hi|hello|hey|greetings|dear\s+hiring|good\s+(morning|afternoon|evening)|i\s+hope\s+this|my\s+name\s+is|i\s+am\s+a\s+|i'm\s+a\s+)/i;
      const bioRe = /\b(years?\s+of\s+experience|passionate\s+video\s+editor|carefully\s+read\s+your)\b/i;
      checks.push(greetingRe.test(trimmed) || bioRe.test(trimmed)
        ? { cls: "fail", msg: "Greeting or Bio Detected: Opening lines waste the 150-char preview." }
        : { cls: "ok", msg: "Zero Greeting / Bio: Opens directly with substance." });

      checks.push(previewChars > 160
        ? { cls: "warn", msg: `Opening Exceeds Preview (${previewChars} chars): Tighten Sentence 1 under 150 characters.` }
        : { cls: "ok", msg: `Preview Hook Fit (${previewChars} chars): Fits inside the ~150-character client preview.` });

      checks.push(words < minW || words > maxW
        ? { cls: "warn", msg: `Word Count (${words}): Outside recommended ${minW}–${maxW} word window.` }
        : { cls: "ok", msg: `Word Budget Optimal (${words} words): Concise and mobile-scannable.` });

      const lower = trimmed.toLowerCase();
      const foundSlop = DATA.bannedWords.filter((w) => new RegExp(`\\b${w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}\\b`, "i").test(lower));
      checks.push(foundSlop.length > 0
        ? { cls: "fail", msg: `Banned AI-Slop Terms Found: ${foundSlop.join(", ")}.` }
        : { cls: "ok", msg: "Vocabulary Clean: Zero banned AI clichés detected." });

      const socialLinkRe = /(https?:\/\/)?(www\.)?(youtube\.com|youtu\.be|instagram\.com|tiktok\.com|t\.me|telegram\.me|wa\.me|facebook\.com)/i;
      checks.push(socialLinkRe.test(trimmed)
        ? { cls: "fail", msg: "Policy Ban Risk: External social media or messaging links detected." }
        : { cls: "ok", msg: "Link Hygiene Passed: No risky external social URLs found." });

      if (/\b(easy\s+task|simple\s+task|very\s+simple|super\s+easy)\b/i.test(trimmed)) {
        checks.push({ cls: "warn", msg: "Value Erosion Risk: Avoid calling creative briefs 'easy' or 'simple'." });
      } else if (/\b(as\s+soon\s+as\s+possible|shortest\s+time)\b/i.test(trimmed)) {
        checks.push({ cls: "warn", msg: "Vague Speed Claim: Replace 'as soon as possible' with exact hours." });
      } else {
        checks.push({ cls: "ok", msg: "Value Framing Solid: No self-devaluation or vague timing phrases." });
      }

      document.getElementById("linterChecks").innerHTML = checks.map((c) => `<div class="lint-item ${c.cls}">${esc(c.msg)}</div>`).join("");
    }

    linterInput.addEventListener("input", runLinter);
    hasScreeningToggle.addEventListener("change", runLinter);
    document.getElementById("loadSampleDraftBtn").addEventListener("click", () => {
      linterInput.value = DATA.proposals[0].text;
      runLinter();
    });
    runLinter();

    document.getElementById("fixedHourlyTable").innerHTML = `
      <thead><tr><th>Criterion</th><th>Fixed-Price Proposals</th><th>Hourly Proposals</th></tr></thead>
      <tbody>${DATA.fixedVsHourly.map((r) => `<tr><td><strong>${esc(r.criterion)}</strong></td><td>${esc(r.fixed)}</td><td>${esc(r.hourly)}</td></tr>`).join("")}</tbody>
    `;

    let activePType = "ALL";
    function renderProposals() {
      const list = activePType === "ALL"
        ? DATA.proposals
        : DATA.proposals.filter((p) => p.budget.toLowerCase().includes(activePType.toLowerCase()));
      document.getElementById("proposalsGrid").innerHTML = list.map((p) => {
        const wCount = p.text.trim().split(/\s+/).length;
        const line1Chars = p.text.split("\n")[0].length;
        return `
          <article class="proposal-card">
            <div class="proposal-header">
              <div>
                <span class="badge badge-neutral">${esc(p.id)} · ${esc(p.tag)}</span>
                <div class="muted-note" style="margin-top:4px;"><strong>${esc(p.budget)}</strong> — ${esc(p.context)}</div>
              </div>
            </div>
            <div class="proposal-body">${esc(p.text)}</div>
            <div class="muted-note"><strong>Mechanism:</strong> ${esc(p.whyItWorks)}</div>
            <div class="proposal-footer">
              <span class="metric-chip">${wCount}w · L1 ${line1Chars}c</span>
              <button type="button" class="copy-btn" data-copy-proposal="${esc(p.id)}">Copy Template</button>
            </div>
          </article>`;
      }).join("");
    }
    renderProposals();

    document.getElementById("proposalFilters").addEventListener("click", (e) => {
      const btn = e.target.closest(".pill");
      if (!btn) return;
      document.querySelectorAll("#proposalFilters .pill").forEach((p) => p.classList.remove("active"));
      btn.classList.add("active");
      activePType = btn.dataset.ptype;
      renderProposals();
    });

    document.getElementById("proposalsGrid").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-copy-proposal]");
      if (!btn) return;
      const item = DATA.proposals.find((p) => p.id === btn.dataset.copyProposal);
      if (item) copyText(item.text, item.id);
    });

    document.getElementById("secretsGrid").innerHTML = DATA.secretsVault
      .map((s) => `<article class="secret-card"><div class="secret-num">EDGE #${esc(s.num)}</div><h3 class="card-title">${esc(s.title)}</h3><p class="muted-note">${esc(s.detail)}</p></article>`)
      .join("");

    document.getElementById("interviewProtocolList").innerHTML = DATA.closingAndDelivery.interviewProtocol.map((item) => `<li>${esc(item)}</li>`).join("");
    document.getElementById("escrowRulesList").innerHTML = DATA.closingAndDelivery.escrowAndGhostRules.map((item) => `<li>${esc(item)}</li>`).join("");

    document.getElementById("operationalScriptsList").innerHTML = DATA.closingAndDelivery.operationalScripts
      .map((sc, idx) => `
        <article class="script-card">
          <div class="script-head">
            <div><h4 class="card-title">${esc(sc.title)}</h4><p class="muted-note">${esc(sc.useCase)}</p></div>
            <button type="button" class="copy-btn" data-copy-script="${idx}">Copy Script</button>
          </div>
          <pre class="script-pre">${esc(sc.script)}</pre>
        </article>`
      ).join("");

    document.getElementById("operationalScriptsList").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-copy-script]");
      if (!btn) return;
      const sc = DATA.closingAndDelivery.operationalScripts[Number(btn.dataset.copyScript)];
      if (sc) copyText(sc.script, sc.title);
    });

    document.getElementById("techSpecsGrid").innerHTML = DATA.techSpecs
      .map((cat) => `<div class="info-card"><h3 class="card-title">${esc(cat.category)}</h3><ul class="ordered-list" style="padding-left:18px;">${cat.items.map((it) => `<li>${esc(it)}</li>`).join("")}</ul></div>`)
      .join("");

    document.getElementById("masterPromptPre").textContent = DATA.aiStrategistPrompt;
    document.getElementById("copyMasterPromptBtn").addEventListener("click", () => {
      copyText(DATA.aiStrategistPrompt, "Master AI Strategist Prompt");
    });

    const searchIndex = [];
    DATA.platformShifts.forEach((s) => searchIndex.push({ section: "#shifts", kind: "Platform Shift", title: `#${s.id} ${s.title}`, body: `${s.legacyApproach} ${s.modernReality} ${s.actionRule}` }));
    DATA.clientArchetypes.forEach((a) => searchIndex.push({ section: "#archetypes", kind: "Client Archetype", title: `${a.code} — ${a.name}`, body: `${a.profile} ${a.hates} ${a.convertsOn}` }));
    DATA.jobDecoder.forEach((d) => searchIndex.push({ section: "#decoder", kind: "Job Signal", title: d.signal, body: `${d.hiddenPain} ${d.response}` }));
    DATA.proposals.forEach((p) => searchIndex.push({ section: "#proposals", kind: "Proposal Blueprint", title: `${p.id} (${p.tag}) — ${p.budget}`, body: `${p.context} ${p.text} ${p.whyItWorks}` }));
    DATA.secretsVault.forEach((s) => searchIndex.push({ section: "#secrets", kind: "Hidden Edge", title: `#${s.num} ${s.title}`, body: s.detail }));
    DATA.closingAndDelivery.operationalScripts.forEach((sc) => searchIndex.push({ section: "#closing", kind: "Chat Script", title: sc.title, body: `${sc.useCase} ${sc.script}` }));
    DATA.techSpecs.forEach((t) => searchIndex.push({ section: "#specs", kind: "Tech Spec", title: t.category, body: t.items.join(" ") }));

    const searchInput = document.getElementById("globalSearch");
    const searchClear = document.getElementById("searchClear");
    const searchPanel = document.getElementById("searchResultsPanel");
    const searchList = document.getElementById("searchResultsList");
    const searchHeading = document.getElementById("searchResultsHeading");

    function runGlobalSearch() {
      const q = searchInput.value.trim().toLowerCase();
      searchClear.hidden = !q;
      if (!q) { searchPanel.hidden = true; return; }
      const hits = searchIndex.filter((item) => item.title.toLowerCase().includes(q) || item.body.toLowerCase().includes(q) || item.kind.toLowerCase().includes(q)).slice(0, 20);
      searchPanel.hidden = false;
      searchHeading.textContent = `Search Results (${hits.length} match${hits.length === 1 ? "" : "es"})`;
      searchList.innerHTML = hits.length
        ? hits.map((h) => `<a href="${esc(h.section)}" class="search-hit"><span class="badge badge-neutral">${esc(h.kind)}</span><div><strong>${esc(h.title)}</strong></div><div class="muted-note">${esc(h.body.slice(0, 200))}${h.body.length > 200 ? "..." : ""}</div></a>`).join("")
        : `<div class="muted-note">No matching playbook entries found for "${esc(searchInput.value)}".</div>`;
    }

    searchInput.addEventListener("input", runGlobalSearch);
    searchClear.addEventListener("click", () => { searchInput.value = ""; runGlobalSearch(); });
    document.getElementById("closeSearchResults").addEventListener("click", () => { searchPanel.hidden = true; });
    searchList.addEventListener("click", () => { searchPanel.hidden = true; });

    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement.tagName !== "INPUT" && document.activeElement.tagName !== "TEXTAREA") {
        e.preventDefault();
        searchInput.focus();
      }
    });

    const sections = Array.from(document.querySelectorAll("main .section"));
    const navLinks = Array.from(document.querySelectorAll(".nav-item, .quick-link"));
    if ("IntersectionObserver" in window) {
      const obs = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              const id = entry.target.id;
              navLinks.forEach((n) => n.classList.toggle("active", n.dataset.section === id));
            }
          });
        },
        { rootMargin: "-20% 0px -70% 0px" }
      );
      sections.forEach((s) => obs.observe(s));
    }
  }

  const authForm = document.getElementById("authForm");
  const authUser = document.getElementById("authUser");
  const authPass = document.getElementById("authPass");
  const authError = document.getElementById("authError");
  const authSubmitBtn = document.getElementById("authSubmitBtn");
  const togglePassBtn = document.getElementById("togglePassBtn");

  if (togglePassBtn) {
    togglePassBtn.addEventListener("click", () => {
      const showing = authPass.type === "text";
      authPass.type = showing ? "password" : "text";
      togglePassBtn.textContent = showing ? "Show" : "Hide";
      togglePassBtn.setAttribute("aria-label", showing ? "Show password" : "Hide password");
    });
  }

  const cachedJson = safeGet(window.sessionStorage, SESSION_KEY);
  if (cachedJson) {
    try {
      initPlaybookApp(JSON.parse(cachedJson));
    } catch (_) {
      safeRemove(window.sessionStorage, SESSION_KEY);
    }
  }

  let unlocking = false;
  async function handleUnlock(e) {
    if (e && e.preventDefault) e.preventDefault();
    if (unlocking) return;
    if (!authUser.value.trim() || !authPass.value) {
      authError.textContent = "Please enter both login and password.";
      authError.hidden = false;
      return;
    }
    unlocking = true;
    authError.hidden = true;
    authSubmitBtn.disabled = true;
    authSubmitBtn.textContent = "Decrypting...";
    try {
      let data;
      try {
        data = await decryptVault(authUser.value, authPass.value);
      } catch (firstErr) {
        if (!firstErr.isSystem && authPass.value !== authPass.value.trim()) {
          data = await decryptVault(authUser.value, authPass.value.trim());
        } else {
          throw firstErr;
        }
      }
      safeSet(window.sessionStorage, SESSION_KEY, JSON.stringify(data));
      initPlaybookApp(data);
    } catch (err) {
      authError.textContent = err && err.isSystem ? err.message : "Invalid login or password.";
      authError.hidden = false;
      authPass.focus();
      authPass.select();
    } finally {
      unlocking = false;
      authSubmitBtn.disabled = false;
      authSubmitBtn.textContent = "Unlock Dossier";
    }
  }

  authForm.addEventListener("submit", handleUnlock);
  authSubmitBtn.addEventListener("click", handleUnlock);
})();
  </script>
</body>
</html>
